-- dpos / conky — operator-cult industrial.
-- One enormous number (1m load avg). One daily rite in serif italic.
-- Three mono hairlines underneath: uptime, ip, temp.
-- The whole panel right-aligns; the load number anchors the eye.

conky.config = {
  alignment            = 'top_right',
  background           = true,
  border_width         = 0,
  cpu_avg_samples      = 2,
  default_color        = 'd0d0d0',
  default_outline_color = '000000',
  default_shade_color  = '000000',
  double_buffer        = true,
  draw_borders         = false,
  draw_graph_borders   = false,
  draw_outline         = false,
  draw_shades          = false,
  use_xft              = true,
  xftalpha             = 1.0,
  font                 = 'DejaVu Sans Mono:size=9',
  gap_x                = 36,
  gap_y                = 70,
  minimum_height       = 5,
  minimum_width        = 320,
  no_buffers           = true,
  out_to_console       = false,
  out_to_stderr        = false,
  extra_newline        = false,
  own_window           = true,
  own_window_argb_visual = true,
  own_window_argb_value  = 0,
  own_window_class     = 'Conky',
  own_window_type      = 'desktop',
  own_window_hints     = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  own_window_transparent = false,
  show_graph_range     = false,
  show_graph_scale     = false,
  stippled_borders     = 0,
  update_interval      = 2.0,
  uppercase            = false,
  use_spacer           = 'none',
};

conky.text = [[
${alignr}${color cc0000}${font DejaVu Sans Mono:size=9}// LOAD${font}${color}
${alignr}${color ff2222}${voffset -4}${font DejaVu Serif:weight=bold:size=82}${loadavg 1}${font}${color}
${voffset -28}
${alignr}${color cc0000}${font DejaVu Sans Mono:size=9}// RITE${font}${color}
${alignr 320}${color dedede}${font DejaVu Serif:italic:size=12}${execi 1800 ~/.local/bin/dpos-rite}${font}${color}
${voffset 10}
${alignr}${color cc0000}${font DejaVu Sans Mono:size=9}// FACTS${font}${color}
${alignr}${color 9a9a9a}${font Cascadia Code:size=9}up ${uptime_short}${font}${color}
${alignr}${color 9a9a9a}${font Cascadia Code:size=9}ip ${if_existing /sys/class/net/eth0/operstate up}${addr eth0}${else}${if_existing /sys/class/net/wlan0/operstate up}${addr wlan0}${else}∅${endif}${endif}${font}${color}
${alignr}${color 9a9a9a}${font Cascadia Code:size=9}temp ${execi 10 vcgencmd measure_temp 2>/dev/null | sed 's/temp=//;s/.C.*//' || awk '{printf "%.0f", $1/1000}' /sys/class/thermal/thermal_zone0/temp 2>/dev/null}C${font}${color}
${voffset 10}
${alignr}${color cc0000}${font DejaVu Sans Mono:size=8}─────────────────${font}${color}
${alignr}${color 606060}${font DejaVu Sans Mono:size=8}SIGIL ▸ 0042${font}${color}
]];

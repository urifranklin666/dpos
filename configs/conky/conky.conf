-- dpos / conky — small system panel, top-right, transparent, mono red.
-- conky_version 1.18+ on bookworm.

conky.config = {
  alignment = 'top_right',
  background = true,
  border_width = 0,
  cpu_avg_samples = 2,
  default_color = 'd0d0d0',
  default_outline_color = '000000',
  default_shade_color = '000000',
  double_buffer = true,
  draw_borders = false,
  draw_graph_borders = false,
  draw_outline = false,
  draw_shades = false,
  use_xft = true,
  font = 'Cascadia Code:size=9',
  gap_x = 18,
  gap_y = 50,
  minimum_height = 5,
  minimum_width = 220,
  net_avg_samples = 2,
  no_buffers = true,
  out_to_console = false,
  out_to_stderr = false,
  extra_newline = false,
  own_window = true,
  own_window_argb_visual = true,
  own_window_argb_value = 160,
  own_window_class = 'Conky',
  own_window_type = 'desktop',
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  own_window_transparent = false,
  show_graph_range = false,
  show_graph_scale = false,
  stippled_borders = 0,
  update_interval = 2.0,
  uppercase = false,
  use_spacer = 'none',
  default_bar_height = 6,
  default_bar_width = 200,
};

conky.text = [[
${color cc0000}// dpos${color}  ${alignr}${color 9a9a9a}${time %Y-%m-%d %H:%M:%S}${color}
${color cc0000}─────────────────────────────────${color}
${color cc0000}host${color}    ${alignr}${nodename}
${color cc0000}kernel${color}  ${alignr}${kernel} ${machine}
${color cc0000}up${color}      ${alignr}${uptime_short}
${color cc0000}load${color}    ${alignr}${loadavg 1} · ${loadavg 2} · ${loadavg 3}

${color cc0000}cpu${color}    ${cpu cpu0}% ${color cc0000}${cpubar 4,160 cpu0}${color}
${color cc0000}temp${color}   ${if_match ${exec vcgencmd measure_temp 2>/dev/null | sed 's/temp=//;s/.C.*//'} > 70}${color ffb000}${endif}${exec vcgencmd measure_temp 2>/dev/null | sed 's/temp=//;s/.C.*//' || echo n/a}C${color}

${color cc0000}ram${color}    ${mem}/${memmax} (${memperc}%) ${color cc0000}${membar 4,90}${color}
${color cc0000}disk${color}   ${fs_used /}/${fs_size /} ${color cc0000}${fs_bar 4,90 /}${color}

${color cc0000}net${color}    ${if_existing /sys/class/net/eth0/operstate up}eth0 ${addr eth0}${else}${if_existing /sys/class/net/wlan0/operstate up}wlan0 ${addr wlan0}${else}${color 880000}offline${color}${endif}${endif}
${color cc0000}dn${color}     ${downspeed eth0} ${color 9a9a9a}${totaldown eth0}${color}
${color cc0000}up${color}     ${upspeed eth0}   ${color 9a9a9a}${totalup eth0}${color}

${color cc0000}top${color}    ${color 9a9a9a}cpu%      mem%${color}
${color}${top name 1}  ${top cpu 1}  ${top mem 1}
${color}${top name 2}  ${top cpu 2}  ${top mem 2}
${color}${top name 3}  ${top cpu 3}  ${top mem 3}
${color cc0000}─────────────────────────────────${color}
${color 606060}// it's fine. it's all fine.${color}
]];

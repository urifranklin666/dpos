# dpos / tmux — operator-cult industrial.
# Mono everywhere. Red on black. // eyebrow grammar in the status bar.
# No icons. No emojis.

# ---- core ----
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty:Tc,xterm-256color:Tc"
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ---- prefix (keep C-b; user can override) ----
# set -g prefix C-a; unbind C-b; bind C-a send-prefix

# ---- splits ----
unbind '"'
unbind '%'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "// reloaded."

# ---- pane nav (matches i3 vim-style) ----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- copy mode — vi ----
setw -g mode-keys vi
bind v copy-mode
bind P paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# ============================================================
# theme — operator-cult industrial
# ============================================================
%hidden DPOS_BG="#060606"
%hidden DPOS_BG2="#0a0a0a"
%hidden DPOS_FG="#dedede"
%hidden DPOS_DIM="#606060"
%hidden DPOS_MID="#9a9a9a"
%hidden DPOS_RED="#cc0000"
%hidden DPOS_RED_BR="#ff2222"
%hidden DPOS_RED_DIM="#880000"
%hidden DPOS_RED_DEEP="#3a0000"
%hidden DPOS_BORDER="#2b0000"

# panes
set -g pane-border-style "fg=$DPOS_BORDER,bg=default"
set -g pane-active-border-style "fg=$DPOS_RED,bg=default"
set -g pane-border-lines single

# status bar
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=$DPOS_BG,fg=$DPOS_FG"

set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[fg=$DPOS_RED_BR,bold]// dpos#[fg=$DPOS_RED_DIM,nobold] · #[fg=$DPOS_MID]#S #[fg=$DPOS_BORDER]│ "

set -g status-right "#[fg=$DPOS_BORDER]│ #[fg=$DPOS_DIM]#h #[fg=$DPOS_RED_DIM]· #[fg=$DPOS_FG]%H:%M #[fg=$DPOS_RED_DIM]· #[fg=$DPOS_DIM]%Y-%m-%d "

# window status
setw -g window-status-style "fg=$DPOS_DIM,bg=$DPOS_BG"
setw -g window-status-format " #[fg=$DPOS_DIM]#I:#W "
setw -g window-status-current-style "fg=$DPOS_RED_BR,bg=$DPOS_BG"
setw -g window-status-current-format " #[fg=$DPOS_RED_BR,bold]▌ #I:#W "
setw -g window-status-separator ""

# messages
set -g message-style "fg=$DPOS_FG,bg=$DPOS_BG2"
set -g message-command-style "fg=$DPOS_FG,bg=$DPOS_BG2"

# mode (copy / selection)
setw -g mode-style "fg=$DPOS_FG,bg=$DPOS_RED_DEEP"

# clock
setw -g clock-mode-colour "$DPOS_RED_BR"
setw -g clock-mode-style 24

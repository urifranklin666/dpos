#
# dpos / picom — tuned for Raspberry Pi 4B (VideoCore VI).
# light shadows + fade. no blur. glx backend (vc4-kms-v3d handles GL fine).
#

backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = false;

# ---- shadows -------------------------------------------------------------
shadow = true;
shadow-radius = 8;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.45;
shadow-color = "#000000";

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'i3-frame'",
  "_GTK_FRAME_EXTENTS@:c",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_NET_WM_WINDOW_TYPE@:a *= 'MENU'",
];

# ---- fade -----------------------------------------------------------------
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;
no-fading-openclose = false;

# ---- opacity --------------------------------------------------------------
inactive-opacity = 1.0;
active-opacity   = 1.0;
frame-opacity    = 1.0;
inactive-opacity-override = false;
focus-exclude = [ "class_g = 'Cairo-clock'" ];

opacity-rule = [
  "92:class_g = 'Alacritty' && focused",
  "85:class_g = 'Alacritty' && !focused",
  "98:class_g = 'Rofi'",
];

# ---- corners (picom-jonaburg / picom-pijulius fork only — comment if upstream) --
# corner-radius = 0;

# ---- blur (off on the Pi — VC6 hates it) ---------------------------------
blur-background = false;

# ---- wintypes --------------------------------------------------------------
wintypes:
{
  tooltip       = { fade = true; shadow = false; opacity = 0.95; focus = true; };
  dock          = { shadow = false; };
  dnd           = { shadow = false; };
  popup_menu    = { opacity = 0.95; shadow = true; };
  dropdown_menu = { opacity = 0.95; shadow = true; };
  utility       = { shadow = false; };
  notification  = { shadow = true; opacity = 0.95; };
  splash        = { shadow = false; };
  desktop       = { shadow = false; };
};

# ---- glx options (Pi-safe) ------------------------------------------------
glx-no-stencil = true;
glx-copy-from-front = false;

# ---- detect / rounded ------------------------------------------------------
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

; dpos / polybar — top bar with deadplug.digital tokens
; module order roughly: brand → workspaces → window title │ cpu mem temp │ net │ vol │ date

[colors]
bg       = #060606
bg-alt   = #0a0a0a
fg       = #dedede
fg-dim   = #606060
fg-mid   = #9a9a9a
red      = #cc0000
red-br   = #ff2222
red-dim  = #880000
red-deep = #3a0000
border   = #1c0000
ok       = #22cc44
warn     = #ffb000
under    = #cc0000

[bar/dpos]
monitor       = ${env:MONITOR:}
width         = 100%
height        = 28
fixed-center  = true
background    = ${colors.bg}
foreground    = ${colors.fg}

border-size       = 0
border-bottom-size = 1
border-color       = ${colors.border}

padding-left   = 2
padding-right  = 2
module-margin  = 1

line-size      = 2
line-color     = ${colors.red}

font-0 = Cascadia Code:size=10;2
font-1 = Symbols Nerd Font:size=11;2
font-2 = Fira Code:size=10;2

modules-left   = brand sep workspaces sep title
modules-center = date
modules-right  = sep cpu mem temp sep net sep vol sep power

cursor-click   = pointer
enable-ipc     = true
wm-restack     = i3
override-redirect = false
tray-position  = none

separator =
fixed-center = true

[module/sep]
type = custom/text
content = " · "
content-foreground = ${colors.red-dim}

[module/brand]
type = custom/text
; tiny dry brand mark
content = "deadplug "
content-foreground = ${colors.red-br}
content-padding = 1

[module/workspaces]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = false
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false
fuzzy-match = false

format = <label-state> <label-mode>

label-mode-padding = 1
label-mode-foreground = ${colors.bg}
label-mode-background = ${colors.red}

label-focused            = %index%
label-focused-foreground = ${colors.fg}
label-focused-background = ${colors.red-deep}
label-focused-underline  = ${colors.red-br}
label-focused-padding    = 1

label-unfocused          = %index%
label-unfocused-foreground = ${colors.fg-dim}
label-unfocused-padding  = 1

label-visible           = %index%
label-visible-foreground = ${colors.fg-mid}
label-visible-padding   = 1

label-urgent            = %index%
label-urgent-foreground = ${colors.bg}
label-urgent-background = ${colors.red-br}
label-urgent-padding    = 1

[module/title]
type = internal/xwindow
format = <label>
format-foreground = ${colors.fg-mid}
label = %title%
label-maxlen = 64

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = "cpu "
format-prefix-foreground = ${colors.red}
label = %percentage:2%%
label-foreground = ${colors.fg}

[module/mem]
type = internal/memory
interval = 3
format = <label>
format-prefix = "mem "
format-prefix-foreground = ${colors.red}
label = %percentage_used:2%%

[module/temp]
type = internal/temperature
interval = 5
thermal-zone = 0
warn-temperature = 70
units = true

format = <label>
format-prefix = "t "
format-prefix-foreground = ${colors.red}
format-warn = <label-warn>
format-warn-prefix = "t "
format-warn-prefix-foreground = ${colors.red-br}
label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${colors.warn}

[module/net]
type = internal/network
; Try eth0 first; if you're on wifi, change to wlan0.
interface = eth0
interval = 3
accumulate-stats = true

format-connected = <label-connected>
label-connected = "net %downspeed:8%"
label-connected-foreground = ${colors.fg}
label-disconnected = "net offline"
label-disconnected-foreground = ${colors.warn}

[module/vol]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = "vol %percentage%%"
label-volume-foreground = ${colors.fg}
label-muted = "vol mute"
label-muted-foreground = ${colors.red-dim}

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d
time = %H:%M:%S
label = %date%  %time%
label-foreground = ${colors.fg}
format-prefix = ""
format-prefix-foreground = ${colors.red}

[module/power]
type = custom/menu
expand-right = false
format-spacing = 1
label-open = "⏻"
label-open-foreground = ${colors.red-br}
label-close = "x"
label-close-foreground = ${colors.fg-dim}
label-separator = " · "
label-separator-foreground = ${colors.red-dim}

menu-0-0 = lock
menu-0-0-exec = i3lock -c 050505
menu-0-1 = logout
menu-0-1-exec = i3-msg exit
menu-0-2 = reboot
menu-0-2-exec = systemctl reboot
menu-0-3 = halt
menu-0-3-exec = systemctl poweroff

[settings]
screenchange-reload = true
pseudo-transparency = false

[global/wm]
margin-top = 0
margin-bottom = 0

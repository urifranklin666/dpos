; dpos / polybar — operator-cult industrial.
; Every module label is prefixed `// `. No icon glyphs. Active modules get
; a 2px red underline. The center slot is reserved for the // ON AIR tally
; which is invisible when the upstream stream isn't broadcasting.

[colors]
bg       = #060606
bg-alt   = #0a0a0a
fg       = #dedede
fg-dim   = #606060
fg-mid   = #9a9a9a
red      = #cc0000
red-br   = #ff2222
red-dim  = #880000
red-deep = #3a0000
border   = #1c0000
warn     = #ffb000

[bar/dpos]
monitor       = ${env:MONITOR:}
width         = 100%
height        = 30
fixed-center  = true
background    = ${colors.bg}
foreground    = ${colors.fg}

border-size        = 0
border-bottom-size = 2
border-bottom-color = ${colors.red}

padding-left  = 3
padding-right = 3
module-margin = 2

line-size  = 2
line-color = ${colors.red}

font-0 = Cascadia Code:size=10.5;2
font-1 = DejaVu Sans Mono:size=10.5;2
font-2 = Symbols Nerd Font:size=11;2

modules-left   = brand sep workspaces sep title
modules-center = onair
modules-right  = cpu sep mem sep temp sep net sep vol sep date sep power

cursor-click   = pointer
enable-ipc     = true
wm-restack     = i3

[module/brand]
type = custom/text
content = "// dpos"
content-foreground = ${colors.red-br}
content-padding = 1

[module/sep]
type = custom/text
content = "·"
content-foreground = ${colors.red-deep}
content-padding = 1

[module/workspaces]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = false
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false

format = <label-state> <label-mode>

label-mode-padding = 1
label-mode-foreground = ${colors.bg}
label-mode-background = ${colors.red}

label-focused              = "▌ %index%"
label-focused-foreground   = ${colors.fg}
label-focused-background   = ${colors.bg}
label-focused-underline    = ${colors.red-br}
label-focused-padding      = 1

label-unfocused            = "%index%"
label-unfocused-foreground = ${colors.fg-dim}
label-unfocused-padding    = 1

label-visible              = "%index%"
label-visible-foreground   = ${colors.fg-mid}
label-visible-padding      = 1

label-urgent               = "▌ %index%"
label-urgent-foreground    = ${colors.bg}
label-urgent-background    = ${colors.red-br}
label-urgent-padding       = 1

[module/title]
type = internal/xwindow
label = "// %title%"
label-foreground = ${colors.fg-mid}
label-maxlen = 56

[module/onair]
type = custom/script
exec = ${env:HOME}/.local/bin/dpos-onair
interval = 5
format-foreground = ${colors.red-br}
format-underline  = ${colors.red-br}
format-padding    = 1

[module/cpu]
type = internal/cpu
interval = 2
label = "// CPU %percentage:2%"
label-foreground = ${colors.fg}

[module/mem]
type = internal/memory
interval = 3
label = "// MEM %percentage_used:2%"
label-foreground = ${colors.fg}

[module/temp]
type = internal/temperature
interval = 5
thermal-zone = 0
warn-temperature = 70
units = true

format = <label>
format-warn = <label-warn>
label      = "// TEMP %temperature-c%"
label-warn = "// TEMP %temperature-c%"
label-warn-foreground = ${colors.warn}

[module/net]
type = internal/network
; eth0 by default; flip to wlan0 if you're on wifi
interface = eth0
interval = 3
accumulate-stats = true

format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected = "// NET %ifname%"
label-disconnected = "// NET ∅"
label-disconnected-foreground = ${colors.fg-dim}

[module/vol]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = "// VOL %percentage:2%"
label-muted = "// VOL ∅"
label-muted-foreground = ${colors.red-dim}

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d
time = %H:%M:%S
label = "// %date% · %time%"
label-foreground = ${colors.fg}

[module/power]
type = custom/menu
expand-right = false
format-spacing = 1
label-open = "▌"
label-open-foreground = ${colors.red-br}
label-close = "✕"
label-close-foreground = ${colors.fg-dim}
label-separator = " · "
label-separator-foreground = ${colors.red-dim}

menu-0-0 = lock
menu-0-0-exec = ${env:HOME}/.local/bin/dpos-lock
menu-0-1 = logout
menu-0-1-exec = i3-msg exit
menu-0-2 = reboot
menu-0-2-exec = systemctl reboot
menu-0-3 = halt
menu-0-3-exec = systemctl poweroff

[settings]
screenchange-reload = true
pseudo-transparency = false

[global/wm]
margin-top = 0
margin-bottom = 0

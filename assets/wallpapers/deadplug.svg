<?xml version="1.0" encoding="UTF-8"?>
<!--
  dpos wallpaper — "operator-cult industrial"
  Asymmetric composition. The wall of faint log lines is the subject;
  sigil and wordmark are watermarks. Corner brackets frame the field
  without enclosing it. Renders to PNG at host display resolution.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"
     preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%"  stop-color="#070707"/>
      <stop offset="100%" stop-color="#020000"/>
    </linearGradient>
    <radialGradient id="bloom" cx="40%" cy="120%" r="85%">
      <stop offset="0%"   stop-color="#3a0000" stop-opacity="0.85"/>
      <stop offset="40%"  stop-color="#1a0000" stop-opacity="0.55"/>
      <stop offset="75%"  stop-color="#080000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#cc0000" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <pattern id="scan" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" fill="#000000" fill-opacity="0.18"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="80%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
    </radialGradient>

    <!-- Mask for the log column: fade in at top, full body, fade out at bottom -->
    <linearGradient id="text-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="22%"  stop-color="white" stop-opacity="1"/>
      <stop offset="78%"  stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="text-mask">
      <rect x="0" y="0" width="1920" height="1080" fill="url(#text-fade)"/>
    </mask>

    <!-- Glow on the small sigil watermark -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#bloom)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- ===== Glyph wall: asymmetric column of operator log lines ===== -->
  <g font-family="DejaVu Sans Mono, monospace" font-size="14" letter-spacing="0.5"
     fill="#cc0000" mask="url(#text-mask)">
    <g opacity="0.20">
      <text x="220" y="120">› sys.ready</text>
      <text x="220" y="148">› auth.daemon listening :443</text>
      <text x="220" y="176">› watchman idle  ·  sigil.cache warm</text>
      <text x="220" y="204">› the silent watcher does not blink</text>
      <text x="220" y="232">› honeypot caught 0 important</text>
      <text x="220" y="260">› aquarium spawned new fish</text>
      <text x="220" y="288">› cargo cult holds. today, twice.</text>
      <text x="220" y="316">› owncast pid 1247</text>
      <text x="220" y="344">› crowdsec accepted 42 events</text>
      <text x="220" y="372">› ember count 8 stable</text>
      <text x="220" y="400">› ritual.next 03:17:00</text>
      <text x="220" y="428">› backup completed silently</text>
      <text x="220" y="456">› patch liturgy: glibc, tonight</text>
      <text x="220" y="484">› journalctl is asleep but listening</text>
      <text x="220" y="512">› dns reachable (again)</text>
      <text x="220" y="540">› confessional confessions: 0</text>
      <text x="220" y="568">› cemetery interred 1</text>
      <text x="220" y="596">› fortune cookies remaining: ∞</text>
      <text x="220" y="624">› the firmware does not love you</text>
      <text x="220" y="652">› the codex has not changed</text>
      <text x="220" y="680">› the beacon counts 12,847 souls</text>
      <text x="220" y="708">› the moth approaches the flame</text>
      <text x="220" y="736">› eyes on tty1</text>
      <text x="220" y="764">› it is fine. it is all fine.</text>
      <text x="220" y="792">› numbers tonight: ECHO MIKE GOLF</text>
      <text x="220" y="820">› the rite was performed twice</text>
      <text x="220" y="848">› bus factor: 1</text>
      <text x="220" y="876">› apt held for 4 days</text>
      <text x="220" y="904">› cluster: one machine, as ever</text>
      <text x="220" y="932">› the dragon at the top of the rack is real</text>
    </g>
  </g>

  <!-- ===== Small sigil watermark, top-right area (offset from corner bracket) ===== -->
  <g transform="translate(1620 90) scale(0.55)" opacity="0.5" filter="url(#glow)">
    <circle cx="60" cy="60" r="58" fill="none" stroke="#cc0000" stroke-width="1.5" opacity="0.4"/>
    <circle cx="60" cy="60" r="55" fill="#0a0a0a"/>
    <circle cx="60" cy="60" r="55" fill="none" stroke="#cc0000" stroke-width="2"/>
    <rect x="46" y="20" width="7" height="16" rx="2" fill="#cc0000"/>
    <rect x="67" y="20" width="7" height="16" rx="2" fill="#cc0000"/>
    <rect x="38" y="33" width="44" height="28" rx="5" fill="#990000"/>
    <rect x="52" y="61" width="16" height="10" rx="2" fill="#cc0000"/>
    <ellipse cx="50" cy="45" rx="5" ry="5.5" fill="#0a0a0a"/>
    <ellipse cx="70" cy="45" rx="5" ry="5.5" fill="#0a0a0a"/>
    <path d="M58 52 L60 49 L62 52 Z" fill="#0a0a0a"/>
    <rect x="50" y="55" width="4" height="4" rx="1" fill="#0a0a0a"/>
    <rect x="56" y="55" width="4" height="4" rx="1" fill="#0a0a0a"/>
    <rect x="62" y="55" width="4" height="4" rx="1" fill="#0a0a0a"/>
    <path d="M60 71 L60 78" stroke="#cc0000" stroke-width="3" stroke-linecap="round"/>
    <path d="M65 80 L57 92 L63 92 L55 106 L69 88 L63 88 L70 80 Z" fill="#990000"/>
  </g>

  <!-- ===== Wordmark + tagline, bottom-left ===== -->
  <g transform="translate(72 1018)" font-family="DejaVu Sans Mono, monospace">
    <text font-size="20" letter-spacing="4" fill="#dedede" font-weight="700">deadplug.digital</text>
    <text y="22" font-size="11" letter-spacing="8" fill="#880000">// 4B · TRIXIE · OPERATOR INSTANCE</text>
  </g>

  <!-- ===== Corner brackets — chamfered, larger ===== -->
  <g stroke="#cc0000" stroke-width="2" fill="none" opacity="0.55">
    <path d="M 40 40 L 40 100 M 40 40 L 100 40"/>
    <path d="M 1880 40 L 1880 100 M 1880 40 L 1820 40"/>
    <path d="M 40 1040 L 40 980 M 40 1040 L 100 1040"/>
    <path d="M 1880 1040 L 1880 980 M 1880 1040 L 1820 1040"/>
  </g>

  <!-- ===== Sigil number — small mono tag below the watermark ===== -->
  <g transform="translate(1620 224)" font-family="DejaVu Sans Mono, monospace">
    <text font-size="10" letter-spacing="3" fill="#606060">SIGIL ▸ 0042</text>
  </g>

  <rect width="1920" height="1080" fill="url(#scan)"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>

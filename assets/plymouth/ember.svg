<?xml version="1.0" encoding="UTF-8"?>
<!-- ember — small red glow dot. matches the homepage floating embers.
     Soft alpha falloff via radial gradient. plymouth treats it as RGBA. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff4444" stop-opacity="0.95"/>
      <stop offset="35%"  stop-color="#cc0000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#660000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="12" cy="12" r="11" fill="url(#g)"/>
</svg>

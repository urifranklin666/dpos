<?xml version="1.0" encoding="UTF-8"?>
<!--
  dpos plymouth — background plate.
  Same atmospheric layer as the homepage:
    black + faint 48px grid + scanlines + red bloom from below + corner brackets + vignette.
  Rendered to bg.png at install time at the host's display resolution.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"
     preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bloom" cx="50%" cy="115%" r="80%">
      <stop offset="0%"   stop-color="#3a0000" stop-opacity="0.9"/>
      <stop offset="35%"  stop-color="#1a0000" stop-opacity="0.6"/>
      <stop offset="65%"  stop-color="#080000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%"  stop-color="#060606"/>
      <stop offset="100%" stop-color="#030000"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#cc0000" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="scan" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" fill="#000000" fill-opacity="0.18"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="80%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#bloom)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- corner brackets — chamfered, like /homepage clip-path corners -->
  <g stroke="#cc0000" stroke-width="2" fill="none" opacity="0.55">
    <path d="M 32 32 L 32 84 M 32 32 L 84 32"/>
    <path d="M 1888 32 L 1888 84 M 1888 32 L 1836 32"/>
    <path d="M 32 1048 L 32 996 M 32 1048 L 84 1048"/>
    <path d="M 1888 1048 L 1888 996 M 1888 1048 L 1836 1048"/>
  </g>

  <rect width="1920" height="1080" fill="url(#scan)"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
